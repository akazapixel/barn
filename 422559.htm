ponse.","upvoteCount":0,"url":"https://forum.freecodecamp.org/t/javascript-if-else-statement/422559/10"},{"@type":"Answer","author":{"@type":"Person","name":"kevinSmith","url":"https://forum.freecodecamp.org/u/kevinSmith"},"dateModified":"2020-09-25T01:59:21.028Z","datePublished":"2020-09-25T01:47:14.542Z","text":"What I don’t understand is why your console output is preceded with “Search”. Is your console statement:\n\nconsole.log('Search', search);\n\nIf that’s the case, then the basic shape of your data is:\n\n{\n\nquery: 'deadpool',\n\nresult: {\n\nResponse: 'True',\n\nSearch: [\n\n{ Title: 'Deadpool' /* etc. */ },\n\n{ Title: 'Deadpool 2' /* etc. */ },\n\n// etc.\n\n],\n\n},\n\n}\n\nIf that is the case, then your if statement should be right at search.result.response.\n\nBut this is async data so it all depends on when and where you access it. As Randy suggested, you need to tell us exactly what it is right before that if statement. I would want you to insert:\n\nconsole.log('search JSON is -\u003e', JSON.stringify(search, null, 2));\n\nconsole.log('typeof search is -\u003e', typeof search);\n\nso that your code looks like:\n\nexport const searchQuery = search =\u003e {\n\nconsole.log('search JSON is -\u003e', JSON.stringify(search, null, 2));\n\nconsole.log('typeof search is -\u003e', typeof search);\n\nif (search.Response) {\n\n// etc.\n\nDo it exactly like that. And show us the result and show us the exact code that is logging it out. You don’t have to take a picture, you can just cut and paste.\n\nIf that doesn’t solve your problem , then you will need to provide a link to a pen or repo or something. We need to see more to figure out what is going on. You can’t expect the mechanic to tell what is wrong with your car if he can only see 4 square inches of the engine in a dimly lit room.\n\nAgain, I think there is one of two problems going on here:\n\nYou are misunderstanding the shape of your data. That is the purpose of the console.log statements I am suggesting.\n\nIt is VERY common for people to not understand how async works in JS. It is VERY common for people to try to access data before it is “ready” and get errors like this. The data may look like that when it arrives, but you may be calling searchQuery before that data has returned - this is a VERY common mistake. That is why it is crucially important that you confirm that you putting the console.log statements exactly where we are telling you.","upvoteCount":1,"url":"https://forum.freecodecamp.org/t/javascript-if-else-statement/422559/11"},{"@type":"Answer","author":{"@type":"Person","name":"saed1","url":"https://forum.freecodecamp.org/u/saed1"},"dateModified":"2020-09-25T14:36:08.921Z","datePublished":"2020-09-25T12:13:13.038Z","text":"Thanks for reply Kevin. Search is an object that has two properties including search query and result which contains API call response.\n\nI have inserted this code :\n\nconsole.log('search JSON is -\u003e', JSON.stringify(search, null, 2)); console.log('typeof search is -\u003e', typeof search);\n\nOutput:\n\nsearch JSON is -\u003e \"deadpool\"\n\nsearchView.js:59 typeof search is -\u003e string\n\nsearchView.js:58 search JSON is -\u003e {\n\n\"query\": \"deadpool\",\n\n\"result\": {\n\n\"Search\": [\n\n{\n\n\"Title\": \"Deadpool\",\n\n\"Year\": \"2016\",\n\n\"imdbID\": \"tt1431045\",\n\n\"Type\": \"movie\",\n\n\"Poster\": \"https://m.media-amazon.com/images/M/MV5BYzE5MjY1ZDgtMTkyNC00MTMyLThhMjAtZGI5OTE1NzFlZGJjXkEyXkFqcGdeQXVyNjU0OTQ0OTY@._V1_SX300.jpg\"\n\n},\n\n{\n\n\"Title\": \"Deadpool 2\",\n\n\"Year\": \"2018\",\n\n\"imdbID\": \"tt5463162\",\n\n\"Type\": \"movie\",\n\n\"Poster\": \"https://m.media-amazon.com/images/M/MV5BNjk1Njk3YjctMmMyYS00Y2I4LThhMzktN2U0MTMyZTFlYWQ5XkEyXkFqcGdeQXVyODM2ODEzMDA@._V1_SX300.jpg\"\n\n},\n\n{\n\n\"Title\": \"Deadpool: No Good Deed\",\n\n\"Year\": \"2017\",\n\n\"imdbID\": \"tt6612630\",\n\n\"Type\": \"movie\",\n\n\"Poster\": \"https://m.media-amazon.com/images/M/MV5BODAxNDFhNGItMzdiMC00NDM1LW /MV5BMjA0OTg1NDEyMV5BMl5BanBnXkFtZTgwNzY4NjU2MzE@._V1_SX300.jpg\"\n\n}\n\n],\n\n\"totalResults\": \"28\",\n\n\"Response\": \"True\"\n\n}\n\n}\n\nsearchView.js:59 typeof search is -\u003e object","upvoteCount":0,"url":"https://forum.freecodecamp.org/t/javascript-if-else-statement/422559/12"},{"@type":"Answer","author":{"@type":"Person","name":"kevinSmith","url":"https://forum.freecodecamp.org/u/kevinSmith"},"dateModified":"2020-09-25T19:15:56.333Z","datePublished":"2020-09-25T19:15:56.320Z","text":"OK, but that output doesn’t make sense with what you’ve posted as the console.log statements you have.  Please post the following:\n\nThe exact code of the _ searchQuery_ function including the added console.log statements.\n\nThe entire output in the console, including the any errors. Again depending on how this is wired up, it may be calling this function more than once.","upvoteCount":1,"url":"https://forum.freecodecamp.org/t/javascript-if-else-statement/422559/13"},{"@type":"Answer","author":{"@type":"Person","name":"saed1","url":"https://forum.freecodecamp.org/u/saed1"},"dateModified":"2020-09-25T20:19:08.024Z","datePublished":"2020-09-25T19:43:58.166Z","text":"export const searchQuery = search =\u003e {\n\nconsole.log('search JSON is -\u003e', JSON.stringify(search, null, 2));\n\nconsole.log('typeof search is -\u003e', typeof search);\n\nif (search.result.Response === 'True') {\n\nconst markUp = `\n\n\u003cdiv class=\"movie__searched\"\u003e\n\n\u003ch1\u003esearch results for \u0026ldquo;${search.query}\u0026rdquo;\u003c/h1\u003e\n\n\u003c/div\u003e\n\n`;\n\nelements.searchResList.insertAdjacentHTML('afterbegin', markUp);\n\n} else {\n\nconst markUp = `\n\n\u003cdiv class=\"movie__searched\"\u003e\n\n\u003ch1\u003eNo search results for \u0026ldquo;${search.query}\u0026rdquo;\u003c/h1\u003e\n\n\u003c/div\u003e\n\n`;\n\nelements.searchResList.insertAdjacentHTML('afterbegin', markUp);\n\n}\n\n}\n\nI get this error when I try to acces the “Response” property like search.Response Otherwise if I access search.result.Response I get the same output as my last reply.\n\nsearchView.js:60 Uncaught (in promise) TypeError: Cannot read property 'Response' of undefined\n\nat Module.searchQuery (searchView.js:60)\n\nat _callee$ (index.js:45)\n\nat tryCatch (runtime.js:63)\n\nat Generator.invoke [as _invoke] (runtime.js:293)\n\nat Generator.eval [as next] (runtime.js:118)\n\nat asyncGeneratorStep (index.js:20)\n\nat _next (index.js:22)\n\nat eval (index.js:22)\n\nat new Promise (\u003canonymous\u003e)\n\nat eval (index.js:22)\n\nThis is how my search class is structured:\n\nexport default class Search {\n\nconstructor(query) {\n\nthis.query = query\n\n}\n\nasync getResults() {\n\nconst apiKey = '#########';\n\nconst proxy = 'http://cors-anywhere.herokuapp.com/';\n\ntry {\n\nconst res = await axios(`${proxy}http://www.omdbapi.com/?apikey=${apiKey}\u0026s=${this.query}\u0026type=movie`);\n\nthis.result = res.data;\n\n} catch (error) {\n\nconsole.log(error);\n\n}\n\n}\n\n}","upvoteCount":0,"url":"https://forum.freecodecamp.org/t/javascript-if-else-statement/422559/14"},{"@type":"Answer","author":{"@type":"Person","name":"kevinSmith","url":"https://forum.freecodecamp.org/u/kevinSmith"},"dateModified":"2020-09-25T20:19:36.602Z","datePublished":"2020-09-25T20:19:36.584Z","text":"I’ve edited your post for readability.  When you enter a code block into a forum post, please precede it with a separate line of three backticks and follow it with a separate line of three backticks to make it easier to read.\n\nYou can also use the “preformatted text” tool in the editor (\u003c/\u003e) to add backticks around text.\n\n[Pre-formatted-text]\n\nSee this post to find the backtick on your keyboard.\n\nNote: Backticks (`)  are not single quotes (’).","upvoteCount":0,"url":"https://forum.freecodecamp.org/t/javascript-if-else-statement/422559/15"},{"@type":"Answer","author":{"@type":"Person","name":"kevinSmith","url":"https://forum.freecodecamp.org/u/kevinSmith"},"dateModified":"2020-09-25T20:22:29.517Z","datePublished":"2020-09-25T20:22:29.507Z","text":"OK, but how and when is searchQuery being called. Can you make a repo for this so we can see what is going on?","upvoteCount":0,"url":"https://forum.freecodecamp.org/t/javascript-if-else-statement/422559/16"},{"@type":"Answer","author":{"@type":"Person","name":"saed1","url":"https://forum.freecodecamp.org/u/saed1"},"dateModified":"2020-09-25T20:27:49.819Z","datePublished":"2020-09-25T20:27:49.805Z","text":"I call this searchQuery method in my controller class after getting movie data from API call. I hope I make sense.\n\n//2-CREATE SEARCH OBJECT\n\nstate.search = new Search(query);\n\n//3-PREPARE UI FOR RESULTS LIKE LOADER AND CLEAR SEARCH INPUT\n\nsearchView.clearInput();\n\nsearchView.clearResult();\n\nrenderLoader(elements.searchResList);\n\ntry {\n\n//4-SEARCH FOR MOVIES\n\nawait state.search.getResults();\n\n//5-RENDER the results on UI\n\nclearLoader();\n\nsearchView.searchQuery(state.search);\n\nsearchView.renderResults(state.search.result);\n\n} catch (error) {\n\nconsole.log(error)\n\n}","upvoteCount":0,"url":"https://forum.freecodecamp.org/t/javascript-if-else-statement/422559/17"},{"@type":"Answer","author":{"@type":"Person","name":"kevinSmith","url":"https://forum.freecodecamp.org/u/kevinSmith"},"dateModified":"2020-09-25T20:49:36.563Z","datePublished":"2020-09-25T20:49:36.543Z","text":"OK, another layer to the onion. I would really rather you put this in a repo so we can see everything.\n\nOK, so you have a class that you are instantiating on:\n\nstate.search = new Search(query);\n\nOn that class you are calling the method _ getResults_. That is getting an asynchronous result back, and dotting into that with res.data and storing that on the class property result.\n\nSo, back in your try block, you are passing the entire class with:\n\nsearchView.searchQuery(state.search);\n\nDid you want to pass the entire class? I would expect to just pass that stored result as state.search.result. But OK.\n\nSo you should be able to access that as search.result.Response.\n\nWhat I don’t understand is how you can show us an object that you’re getting and at the same time. This:\n\nCannot read property 'Response' of undefined\n\nis telling us that search.result is undefined. That does not jive with the JSON output you are displaying. It can’t be defined and undefined and the same time.\n\nThis statement:\n\nI get this error when I try to acces the “Response” property like search.Response\n\nOtherwise if I access search.result.Response I get the same output as my last reply.\n\ndoesn’t make sense, those two lines are arguing with each other. If the first line is true, then that means that search is undefined. But if that is true, then the second line can’t be true. Those two lines are mutually exclusive.","upvoteCount":0,"url":"https://forum.freecodecamp.org/t/javascript-if-else-statement/422559/18"},{"@type":"Answer","author":{"@type":"Person","name":"kevinSmith","url":"https://forum.freecodecamp.org/u/kevinSmith"},"dateModified":"2020-09-25T20:51:05.771Z","datePublished":"2020-09-25T20:51:05.758Z","text":"I can’t speak for everyone, but for me, I feel like I’ve reached and endpoint. There are too many things that you are saying that don’t line up. If you want my help, you will need to put this in a repo and provide the link. If there is an API key, you can PM that. If you do that, I can help you. Without that, I don’t think there’s anything more I can do.","upvoteCount":2,"url":"https://forum.freecodecamp.org/t/javascript-if-else-statement/422559/19"},{"@type":"Answer","author":{"@type":"Person","name":"Naomi","url":"https://forum.freecodecamp.org/u/Naomi"},"dateModified":"2020-09-25T22:43:02.105Z","datePublished":"2020-09-25T22:43:02.092Z","text":"Thank you for sharing the link to your repository. Allow me a few minutes to clone it to my local machine and spin it up.\n\nA couple of notes while this loads:\n\nYou have hard-coded your API key into the code. In general, API keys should be treated like passwords and should not be committed to a version control repository. You can leverage the .env file to keep your secrets secret.\n\nIt is also unnecessary to commit your node_modules folder to a repository. This is a lot of data that slows down the clone/fork process. :slight_smile:","upvoteCount":0,"url":"https://forum.freecodecamp.org/t/javascript-if-else-statement/422559/21"},{"@type":"Answer","author":{"@type":"Person","name":"Naomi","url":"https://forum.freecodecamp.org/u/Naomi"},"dateModified":"2020-09-25T22:51:15.341Z","datePublished":"2020-09-25T22:51:15.314Z","text":"This is what I am seeing in the console:\n\n[image]\n\nFrom what I can tell… in this function search is the value of the query parameter. I am not seeing where that query gets passed into an actual HTTP request. :thinking:","upvoteCount":0,"url":"https://forum.freecodecamp.org/t/javascript-if-else-statement/422559/22"}]}}</script>

wer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":1003910,\"name\":\"coder\",\"username\":\"saed1\",\"avatar_template\":\"https://avatars.discourse-cdn.com/v4/letter/s/c6cbf5/{size}.png\",\"created_at\":\"2020-09-25T00:05:13.068Z\",\"cooked\":\"\\u003cp\\u003eI know it’s different but I also tried accessing the Response property like this search.result.Response and it still throws error like cannot property of Response.\\u003c/p\\u003e\",\"post_number\":10,\"post_type\":1,\"posts_count\":23,\"updated_at\":\"2020-09-25T00:05:13.068Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":0,\"reads\":19,\"readers_count\":18,\"score\":3.8,\"yours\":false,\"topic_id\":422559,\"topic_slug\":\"javascript-if-else-statement\",\"display_username\":\"coder\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":268914,\"hidden\":false,\"trust_level\":1,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":false,\"wiki\":false,\"post_url\":\"/t/javascript-if-else-statement/422559/10\",\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":1003928,\"name\":\"Kevin Smith\",\"username\":\"kevinSmith\",\"avatar_template\":\"/user_avatar/forum.freecodecamp.org/kevinsmith/{size}/72934_2.png\",\"created_at\":\"2020-09-25T01:47:14.542Z\",\"cooked\":\"\\u003cp\\u003eWhat I don’t understand is why your console output is preceded with “Search”. Is your console statement:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\"lang-auto\\\"\\u003econsole.log('Search', search);\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eIf that’s the case, then the basic shape of your data is:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\"lang-auto\\\"\\u003e{ \\n  query: 'deadpool',\\n  result: {\\n    Response: 'True',\\n    Search: [\\n      { Title: 'Deadpool' /* etc. */ },\\n      { Title: 'Deadpool 2' /* etc. */ },\\n      // etc.\\n    ],\\n  },\\n}\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eIf that is the case, then your \\u003ccode\\u003eif\\u003c/code\\u003e statement should be right at \\u003cem\\u003esearch.result.response\\u003c/em\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003eBut this is async data so it all depends on when and where you access it. As Randy suggested, you need to tell us exactly what it is right before that \\u003ccode\\u003eif\\u003c/code\\u003e statement. I would want you to insert:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\"lang-auto\\\"\\u003e  console.log('search JSON is -\\u0026gt;', JSON.stringify(search, null, 2));\\n  console.log('typeof search is -\\u0026gt;', typeof search);\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eso that your code looks like:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\"lang-auto\\\"\\u003eexport const searchQuery = search =\\u0026gt; {\\n  console.log('search JSON is -\\u0026gt;', JSON.stringify(search, null, 2));\\n  console.log('typeof search is -\\u0026gt;', typeof search);\\n  if (search.Response) {\\n    // etc.\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eDo it exactly like that. And show us the result and show us the exact code that is logging it out. You don’t have to take a picture, you can just cut and paste.\\u003c/p\\u003e\\n\\u003cp\\u003eIf that doesn’t solve your problem , then you will need to provide a link to a pen or repo or something. We need to see more to figure out what is going on. You can’t expect the mechanic to tell what is wrong with your car if he can only see 4 square inches of the engine in a dimly lit room.\\u003c/p\\u003e\\n\\u003cp\\u003eAgain, I think there is one of two problems going on here:\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003eYou are misunderstanding the shape of your data. That is the purpose of the console.log statements I am suggesting.\\u003c/li\\u003e\\n\\u003cli\\u003eIt is \\u003cem\\u003e\\u003cstrong\\u003eVERY\\u003c/strong\\u003e\\u003c/em\\u003e common for people to not understand how async works in JS. It is \\u003cem\\u003e\\u003cstrong\\u003eVERY\\u003c/strong\\u003e\\u003c/em\\u003e common for people to try to access data before it is “ready” and get errors like this. The data may look like that when it arrives, but you may be calling \\u003cem\\u003esearchQuery\\u003c/em\\u003e before that data has returned - this is a \\u003cem\\u003e\\u003cstrong\\u003eVERY\\u003c/strong\\u003e\\u003c/em\\u003e common mistake. That is why it is crucially important that you confirm that you putting the console.log statements exactly where we are telling you.\\u003c/li\\u003e\\n\\u003c/ol\\u003e\",\"post_number\":11,\"post_type\":1,\"posts_count\":23,\"updated_at\":\"2020-09-25T01:59:21.109Z\",\"reply_count\":1,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":0,\"reads\":20,\"readers_count\":19,\"score\":54.0,\"yours\":false,\"topic_id\":422559,\"topic_slug\":\"javascript-if-else-statement\",\"display_username\":\"Kevin Smith\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":2,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"passes a Turing test 58.3% of the time\",\"title_is_group\":false,\"bookmarked\":false,\"actio 2020-09-25T20:22:29.507Z\",\"reply_count\":1,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":0,\"reads\":12,\"readers_count\":11,\"score\":7.4,\"yours\":false,\"topic_id\":422559,\"topic_slug\":\"javascript-if-else-statement\",\"display_username\":\"Kevin Smith\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"passes a Turing test 58.3% of the time\",\"title_is_group\":false,\"bookmarked\":false,\"actions_summary\":[],\"moderator\":true,\"admin\":false,\"staff\":true,\"user_id\":75682,\"hidden\":false,\"trust_level\":4,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":false,\"wiki\":false,\"post_url\":\"/t/javascript-if-else-statement/422559/16\",\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":1004322,\"name\":\"coder\",\"username\":\"saed1\",\"avatar_template\":\"https://avatars.discourse-cdn.com/v4/letter/s/c6cbf5/{size}.png\",\"created_at\":\"2020-09-25T20:27:49.805Z\",\"cooked\":\"\\u003cp\\u003eI call this searchQuery method in my controller class after getting movie data from API call. I hope I make sense.\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\"lang-auto\\\"\\u003e  //2-CREATE SEARCH OBJECT\\n        state.search = new Search(query);\\n\\n        //3-PREPARE UI FOR RESULTS LIKE LOADER AND CLEAR SEARCH INPUT\\n\\n        searchView.clearInput();\\n        searchView.clearResult();\\n        renderLoader(elements.searchResList);\\n\\n        try {\\n\\n            //4-SEARCH FOR MOVIES  \\n            await state.search.getResults();\\n\\n            //5-RENDER the results on UI\\n            clearLoader();\\n            searchView.searchQuery(state.search);\\n            searchView.renderResults(state.search.result);\\n\\n        } catch (error) {\\n            console.log(error)\\n        }\\n\\u003c/code\\u003e\\u003c/pre\\u003e\",\"post_number\":17,\"post_type\":1,\"posts_count\":23,\"updated_at\":\"2020-09-25T20:27:49.805Z\",\"reply_count\":0,\"reply_to_post_number\":16,\"quote_count\":0,\"incoming_link_count\":0,\"reads\":13,\"readers_count\":12,\"score\":2.6,\"yours\":false,\"topic_id\":422559,\"topic_slug\":\"javascript-if-else-statement\",\"display_username\":\"coder\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"reply_to_user\":{\"id\":75682,\"username\":\"kevinSmith\",\"name\":\"Kevin Smith\",\"avatar_template\":\"/user_avatar/forum.freecodecamp.org/kevinsmith/{size}/72934_2.png\"},\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":268914,\"hidden\":false,\"trust_level\":1,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":false,\"wiki\":false,\"post_url\":\"/t/javascript-if-else-statement/422559/17\",\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":1004334,\"name\":\"Kevin Smith\",\"username\":\"kevinSmith\",\"avatar_template\":\"/user_avatar/forum.freecodecamp.org/kevinsmith/{size}/72934_2.png\",\"created_at\":\"2020-09-25T20:49:36.543Z\",\"cooked\":\"\\u003cp\\u003eOK, another layer to the onion. I would \\u003cem\\u003e\\u003cstrong\\u003ereally\\u003c/strong\\u003e\\u003c/em\\u003e rather you put this in a repo so we can see \\u003cem\\u003eeverything\\u003c/em\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003eOK, so you have a class that you are instantiating on:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\"lang-auto\\\"\\u003estate.search = new Search(query);\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eOn that class you are calling the method _ getResults_. That is getting an asynchronous result back, and dotting into that with \\u003ccode\\u003eres.data\\u003c/code\\u003e and storing that on the class property \\u003cem\\u003eresult\\u003c/em\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003eSo, back in your \\u003ccode\\u003etry\\u003c/code\\u003e block, you are passing the entire class with:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\"lang-auto\\\"\\u003esearchView.searchQuery(state.search);\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eDid you want to pass the entire class? I would expect to just pass that stored result as \\u003cem\\u003estate.search.result\\u003c/em\\u003e. But OK.\\u003c/p\\u003e\\n\\u003cp\\u003eSo you should be able to access that as \\u003cem\\u003esearch.result.Response\\u003c/em\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003eWhat I don’t understand is how you can show us an object that you’re getting and at the same time. This:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\"lang-auto\\\"\\u003eCannot read property 'Response' of undefined\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eis telling us that \\u003cem\\u003esearch.result\\u003c/em\\u003e is \\u003ccode\\u003eundefined\\u003c/code\\u003e. That does not jive with the JSON output you are displaying. It can’t be defined and undefined and the same time.\\u003c/p\\u003e\\n\\u003cp\\u003eThis statement:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\"lang-auto\\\"\\u003eI get this error when I try to acces the “Response” property like search.Response\\nOtherwise if I access search.result.Response I get the same output as my last reply.\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003edoesn’t make sense, those two lines are arguing with each other. If the first line is true, then that means that \\u003cem\\u003esearch\\u003c/em\\u003e is \\u003ccode\\u003eundefined\\u003c/code\\u003e. But if that is true, then the second line can’t be true. Those two lines are mutually exclusive.\\u003c/p\\u003e\",\"post_number\":18,\"post_type\":1,\"posts_count\":23,\"updated_at\":\"2020-09-25T20:49:36.543Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":0,\"reads\":13,\"readers_count\":12,\"score\":2.6,\"yours\":false,\"topic_id\":422559,\"topic_slug\":\"javascript-if-else-statement\",\"display_username\":\"Kevin Smith\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"passes a Turing test 58.3% of the time\",\"title_is_group\":false,\"bookmarked\":false,\"actions_summary\":[],\"moderator\":true,\"admin\":false,\"staff\":true,\"user_id\":75682,\"hidden\":false,\"trust_level\":4,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":false,\"wiki\":false,\"post_url\":\"/t/javascript-if-else-statement/422559/18\",\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":1004335,\"name\":\"Kevin Smith\",\"username\":\"kevinSmith\",\"avatar_template\":\"/user_avatar/forum.freecodecamp.org/kevinsmith/{size}/72934_2.png\",\"created_at\":\"2020-09-25T20:51:05.758Z\",\"cooked\":\"\\u003cp\\u003eI can’t speak f
